<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Catalyst — Gig 4</title>
<!-- PWA: run fullscreen (no Safari chrome) when added to the iPad home screen,
     and give the SW-cached offline shell a theme colour and icon. -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#b45309" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Catalyst" />
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
<link rel="icon" href="./assets/icons/icon-192.png" />
<style>
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --fg: #1a1d22;
    --muted: #6b7280;
    --accent: #d97706;
    /* Solid fill for surfaces carrying white text (buttons, active pills).
       --accent itself is only 3.2:1 against white — below the AA text floor —
       so it's reserved for non-text uses (borders, slider fill, beat dots). */
    --accent-fill: #b45309;
    --highlight: rgba(217,119,6,0.12);
    --chord: #1d4ed8;
    --section: #b45309;
    --border: #e5e7eb;
    --chip-bg: #f3f4f6;
    --beat-idle: #d1d5db;
    --draft: #dc2626;
    --ctl-h: 44px;   /* shared height for header controls, chips, playback group — 44px touch floor */
    --r-ctl: 8px;    /* buttons, chips, inputs */
    --r-card: 12px;  /* panels, dropdowns, draft card */
    --r-sheet: 20px; /* modal */
    --r-pill: 999px; /* fully-rounded tabs/badges */
    --z-panel: 100;  /* dropdown panels (settings) */
    --z-drawer: 200; /* mobile sidebar drawer */
    --z-modal: 300;  /* set-complete modal */
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    grid-template-rows: auto auto auto 1fr auto;
    height: 100vh;
    overflow: hidden;
  }

  /* Left sidebar table of contents */
  .toc-sidebar {
    grid-column: 1;
    grid-row: 1 / -1;
    background: #f5f3f0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

  .toc-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .toc-header h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: #1f2937;
  }

  .toc-toggle {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--fg);
    padding: 4px 8px;
    display: none;
    border-radius: 6px;
  }
  .toc-toggle:hover { background: var(--chip-bg); }

  /* Sidebar collapse button (desktop) */
  .toc-collapse-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 6px;
    line-height: 1;
  }
  .toc-collapse-btn:hover { background: var(--chip-bg); color: var(--fg); }

  /* Collapsed state: grid shrinks sidebar to 0 */
  body.sidebar-collapsed {
    grid-template-columns: 0 minmax(0, 1fr);
  }
  body.sidebar-collapsed .toc-sidebar {
    width: 0;
    min-width: 0;
    overflow: hidden;
    border-right: none;
  }
  body.sidebar-collapsed .toc-collapse-btn {
    display: none;
  }

  .toc-content {
    flex: 1;
    overflow-y: auto;
  }

  .toc-set-title {
    padding: 8px 14px;
    font-weight: 600;
    color: #374151;
    background: #ede9e4;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .toc-set.current .toc-set-title {
    background: var(--accent-fill);
    color: #ffffff;
  }

  .toc-songs {
    display: flex;
    flex-direction: column;
  }

  .toc-song {
    min-height: 44px;
    display: flex;
    align-items: center;
    padding: 6px 20px;
    cursor: pointer;
    color: #4b5563;
    user-select: none;
    font-size: 13px;
    transition: background 0.12s var(--ease);
  }

  .toc-song:hover {
    background: #e5dfd8;
  }

  .toc-song.current {
    background: #fef3c7;
    color: #1f2937;
    font-weight: 500;
  }

  /* Gig bar — gig name left + set tabs centered */
  .gigbar {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .gig-name { font-weight: 700; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  /* When the sidebar is open it already shows the gig name in its header, so
     hide the bar's copy to give the tabs room (prevents Set 1 / Encore clipping). */
  body:not(.sidebar-collapsed) .gig-name { display: none; }
  /* Tabs take the flexible middle and scroll horizontally if cramped, so the
     pinned gig-nav (Prev/Next/Settings) is never pushed off-screen. */
  .set-tabs { display: flex; gap: 4px; flex: 1 1 0; min-width: 0; justify-content: safe center; overflow-x: auto; scrollbar-width: none; }
  .set-tabs::-webkit-scrollbar { display: none; }
  .set-tab { flex-shrink: 0; }
  .gig-nav { display: flex; align-items: center; gap: 8px; flex-shrink: 0; position: relative; }
  .set-tab {
    display: flex;
    align-items: center;
    min-height: 44px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: var(--r-pill);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .set-tab:hover { background: var(--chip-bg); }
  .set-tab.active {
    background: var(--accent-fill);
    color: #ffffff;
  }

  /* Song / control top bar — two compact rows */
  .topbar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 7px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  /* Header: stacked rows. Top = title + Settings; bottom = nav + meta + playback. */
  .topbar-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* no overflow:hidden here — it would clip the dropdown panels */
  }
  .header-top {
    display: flex;
    flex-direction: column;
    align-items: flex-start;   /* title + nav stacked, left-aligned */
    gap: 6px;
  }
  /* Bottom row: nav + meta + playback + settings, centred; wrap if they can't fit. */
  .header-bottom {
    display: flex;
    align-items: center;
    justify-content: center;   /* centre the row (and any wrapped lines) */
    gap: 10px 16px;
    flex-wrap: wrap;
  }
  .song-nav { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .nav-btn { font-size: 13px; font-weight: 600; }
  .header-center {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  /* Let the playback cluster (and its slider) grow to fill the row width. */
  .playback-group { flex: 1 1 260px; min-width: 0; }
  .settings-dd { flex-shrink: 0; position: relative; }

  /* Uniform control height across nav, settings, chips, playback group.
     min-height (not height) so a control needing more room — e.g. a 44px
     touch-target icon button — can grow the row instead of being clipped. */
  .nav-btn,
  #controlsToggle,
  .header-center .meta-chip,
  .playback-group {
    min-height: var(--ctl-h);
  }
  /* Visually-grouped clusters of related controls */
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 5px 8px;
  }

  /* Settings dropdown (chart tools) — right-aligned overlay, two rows */
  .settings-panel {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: var(--z-panel);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: 0 6px 20px rgba(26,29,34,0.14);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  /* Re-assert hiding — the display:flex above would otherwise override [hidden]. */
  .settings-panel[hidden] { display: none; }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  /* Larger, easier-to-tap controls inside the Settings overlay */
  .settings-panel .btn {
    font-size: 16px;
    padding: 10px 18px;
    min-height: 46px;
  }
  .settings-panel .btn.icon {
    font-size: 20px;
    min-width: 46px;
    min-height: 46px;
  }
  .settings-panel .speed-row { font-size: 14px; gap: 12px; }
  .settings-panel .transpose .meta-chip { font-size: 16px; }
  .transpose > span:first-child { color: var(--muted); font-size: 14px; }

  .song-meta { display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow: hidden; }
  .song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-artist { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .draft-badge {
    background: var(--draft);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: var(--r-pill);
    margin-left: 4px;
  }
  .meta-chip {
    background: var(--chip-bg);
    padding: 3px 8px;
    border-radius: var(--r-ctl);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .meta-chip strong { color: var(--fg); margin-left: 3px; }
  /* Key / BPM / Time — same box style + height as the playback group */
  .header-center .meta-chip {
    font-size: 13px;
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    padding: 0 12px;
  }
  /* Fixed-width values so the row never reflows when the key/value changes
     (e.g. G -> G#), which would shift the centred bar + Settings overlay. */
  .header-center .meta-chip strong {
    display: inline-block;
    min-width: 3.2ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .btn {
    background: #ffffff;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    padding: 5px 11px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s var(--ease), border-color 0.12s var(--ease);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn:hover { background: var(--chip-bg); border-color: #d1d5db; }
  .btn:active { transform: translateY(1px); }
  .btn.active { background: var(--accent-fill); color: #ffffff; border-color: var(--accent-fill); }
  .btn.primary { background: var(--accent-fill); color: #ffffff; border-color: var(--accent-fill); font-weight: 600; }
  .btn:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
  .btn.icon { padding: 5px 10px; font-size: 15px; min-width: 44px; min-height: 44px; }

  .transpose { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  /* Fixed-width offset readout so the overlay doesn't resize as the value changes */
  .transpose .meta-chip {
    display: inline-block;
    min-width: 3.2em;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  /* Permanent setlist show/hide toggle — icon-only, first item in the gig bar
     (top bar) next to the "Catalyst — Gig 4" header. */
  .setlist-toggle {
    flex-shrink: 0;
    height: var(--ctl-h);
    padding: 0 12px;
    font-size: 18px;
    line-height: 1;
  }
  .setlist-toggle.active { background: var(--accent-fill); color: #fff; border-color: var(--accent-fill); }
  /* Metronome beats — inline in the playback group, next to Play, instead of
     a standalone full-width row (that row cost 47px of vertical space for
     four dots and nothing else). */
  .beats {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 4px 12px;
    background: var(--panel);
    border-radius: var(--r-pill);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .beat {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--beat-idle);
    transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
  }
  .beat.downbeat { width: 18px; height: 18px; }
  .beat.active { background: var(--accent); transform: scale(1.2); }
  .beat.downbeat.active { box-shadow: 0 0 12px rgba(217,119,6,0.55); }

  /* Progress strip */
  .progress-strip {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1; height: 5px;
    background: var(--chip-bg);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 80ms linear;
  }
  .progress-time {
    font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 44px;
  }
  .progress-time.remaining { text-align: right; }

  /* Variant tab bar */
  .variant-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 6px 16px;
    grid-column: 2;
  }
  .variant-tabs { display: flex; gap: 4px; }
  .variant-tab {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    color: var(--muted);
  }
  .variant-tab:hover { background: var(--chip-bg); }
  .variant-tab.active {
    background: var(--chord);
    color: #fff;
    border-color: var(--chord);
  }

  /* Chart */
  .chart-wrap { flex: 1; overflow: hidden; position: relative; }
  .chart {
    height: 100%;
    overflow-y: auto;
    /* Safety net: chord/lyric lines are white-space:pre (can't wrap without
       breaking column alignment), so a long line at a large font size on a
       narrow iPad-portrait + sidebar-open layout can exceed the visible
       width. Rather than silently clipping it, let it scroll horizontally. */
    overflow-x: auto;
    padding: 16px 28px 60vh;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* Matches applyFontSize()'s base clamp — this is just the pre-JS fallback
       so there's no flash of smaller text before the script runs. */
    font-size: clamp(20px, 2.2vw + 8px, 30px);
    line-height: 1.5;
  }
  .chart::-webkit-scrollbar { width: 6px; }
  .chart::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  /* Edit-mode: textarea takes over the chart area */
  .chart-editor {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    background: #fffaf0;
    padding: 24px 28px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(14px, 1.2vw + 9px, 20px);
    line-height: 1.5;
    color: var(--fg);
    tab-size: 4;
    /* Ensure smooth scrolling on iPad */
    -webkit-overflow-scrolling: touch;
    box-sizing: border-box;
  }
  .chart-editor:focus {
    background: #fef3c7;
  }
  .edit-hint {
    position: absolute;
    bottom: 8px;
    right: 16px;
    font-size: 11px;
    color: var(--muted);
    background: #ffffff;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    pointer-events: none;
    z-index: 2;
  }
  .edited-badge {
    background: var(--accent-fill);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: var(--r-pill);
    margin-left: 4px;
  }
  .btn.editing { background: var(--accent-fill); color: #fff; border-color: var(--accent-fill); }

  .line {
    padding: 4px 8px;
    margin-bottom: 8px;
    border-radius: var(--r-ctl);
    transition: background 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  /* Now-playing line: what sits at the read-line as the chart scrolls.
     Bold yellow highlighter so it's unmistakable against blue chords /
     orange section headers. */
  .line.active {
    background: rgba(250, 204, 21, 0.55);
    box-shadow: inset 6px 0 0 #f59e0b;
    border-radius: var(--r-ctl);
  }
  /* Section/comment sizes are set in em, inheriting from .chart's font-size
     (which the font +/- control sets inline) — this keeps section headers
     reliably bigger than lyrics at every size setting instead of the fixed
     clamp() ranges inverting once the chart font passed ~20px. */
  .line.section {
    color: var(--section);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 1.05em;
    margin-top: 32px;
    margin-bottom: 6px;
    padding: 10px 12px 10px 14px;
    border-left: 4px solid var(--accent);
    background: rgba(217, 119, 6, 0.06);
    border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .line.comment {
    color: var(--muted);
    font-style: italic;
    font-size: 0.78em;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    margin-top: 8px;
  }
  .line.blank { height: 14px; margin-bottom: 0; }
  /* Chord font-size must stay 1em (inherit) — chord-row and lyric-row are
     column-aligned via matching monospace character widths (see
     preprocessChordChart), so shrinking one breaks the alignment. Line-height
     is safe to differ: it tightens the chord-to-its-lyric gap without moving
     characters horizontally. */
  .chord-row { color: var(--chord); font-weight: 700; white-space: pre; line-height: 1.15; }
  .lyric-row { white-space: pre; line-height: 1.35; }

  /* Chord-only progression rows (Intro / Interlude / Outro etc.) —
     evenly-spaced chord chips instead of monospace-padded text. */
  .line.chord-only { padding: 6px 8px; }
  .chord-row.chord-only-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 28px;       /* row gap 4px, column gap 28px between chords */
    white-space: normal;
  }
  .chord-row.chord-only-row .chord-token {
    color: var(--chord);
    font-weight: 700;
    display: inline-block;
  }

  /* Draft empty-state */
  .draft-card {
    margin: 40px auto;
    max-width: 520px;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .draft-card .label {
    background: var(--draft);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 4px 10px;
    border-radius: var(--r-pill);
    display: inline-block;
  }
  .draft-card h2 { margin: 14px 0 6px; font-size: 22px; }
  .draft-card p { color: var(--muted); margin: 6px 0; font-size: 14px; }
  .draft-card .ref {
    margin-top: 14px;
    background: var(--chip-bg);
    padding: 10px 14px;
    border-radius: var(--r-ctl);
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 13px;
    color: var(--fg);
    word-break: break-all;
  }

  .speed-row {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 11px;
    min-width: 0;
  }
  /* Slider fills available space and shrinks when the sidebar narrows the row. */
  .speed-row input[type=range] { flex: 1 1 240px; width: auto; min-width: 0; max-width: 820px; height: 22px; accent-color: var(--accent); }

  /* Set complete modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,20,25,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: var(--z-modal);
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: #ffffff;
    border-radius: var(--r-sheet);
    padding: 32px 36px;
    width: min(440px, 90vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(26,29,34,0.25);
  }
  .modal-title { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; }
  .modal-subtitle { font-size: 22px; font-weight: 700; margin: 10px 0 6px; }
  .modal-meta { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }

  /* Main content area spans column 2 */
  .gigbar, .topbar, .progress-strip, .variant-bar, .chart-wrap {
    grid-column: 2;
  }

  /* Mobile: sidebar becomes slide-in drawer */
  @media (max-width: 767px) {
    body {
      grid-template-columns: 1fr;
    }

    .toc-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: 280px;
      z-index: var(--z-drawer);
      transform: translateX(-100%);
      transition: transform 0.3s ease-out;
      grid-column: auto;
      grid-row: auto;
    }

    .toc-sidebar.open {
      transform: translateX(0);
    }

    .toc-toggle {
      display: block;
    }

  if (/^repeat\b/.test(lower)) return { section: 'repeat', label: lbl };
  if (/^breakdown\b/.test(lower)) return { section: 'bridge', label: lbl };
  if (/^structure\b/.test(lower)) return { section: 'structure', label: lbl };
  if (/^chord\s*overview\b/.test(lower)) return { section: 'comment', label: lbl };
  if (/^whole\s*song\b/.test(lower)) return { section: 'comment', label: lbl };
  if (/^core\b/.test(lower) && inner.length < 10) return { section: 'verse', label: lbl };
  return null;
}

function isChordToken(t) { return CHORD_TOKEN_RE.test(t); }

function isChordLine(line) {
  const t = line.trim();
  if (!t) return false;
  // Reject lines that contain CJK or other non-ASCII letters (those are lyrics)
  if (/[^\x00-\x7F]/.test(t)) return false;
  const tokens = t.split(/\s+/);
  if (!tokens.length) return false;
  // Need at least one true chord token
  if (!tokens.some(tk => /^[A-G]/.test(tk))) return false;
  return tokens.every(isChordToken);
}

function chordPositions(line) {
  const positions = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(line)) !== null) {
    positions.push({ col: m.index, chord: m[0] });
  }
  return positions;
}

function mergeChordLyric(chordLine, lyricLine) {
  const positions = chordPositions(chordLine);
  if (!positions.length) return lyricLine;
  let result = '';
  let lyric = lyricLine || '';
  let lastCol = 0;
  for (const { col, chord } of positions) {
    while (lyric.length < col) lyric += ' ';
    result += lyric.slice(lastCol, col);
    result += '[' + chord + ']';
    lastCol = col;
  }
  result += lyric.slice(lastCol);
  return result;
}

function preprocessChordChart(src) {
  const lines = src.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const raw = lines[i];
    // Existing ChordPro lines (contain inline [...]) pass through
    if (/\[[^\]]+\]/.test(raw)) { out.push(raw); i++; continue; }
    // Blank line
    if (!raw.trim()) { out.push(''); i++; continue; }
    // Section header
    const sec = detectSection(raw);
    if (sec) {
      const tagMap = { intro: 'verse', verse: 'verse', chorus: 'chorus', bridge: 'bridge', prechorus: 'chorus', interlude: 'bridge', outro: 'bridge', transition: 'bridge' };
      if (tagMap[sec.section]) out.push('{start_of_' + tagMap[sec.section] + ': ' + sec.label + '}');
      else out.push('{comment: ' + sec.label + '}');
      i++;
      continue;
    }
    // Chord-only line
    if (isChordLine(raw)) {
      // Look for next non-blank line
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && !isChordLine(lines[j]) && !detectSection(lines[j])) {
        // Pair this chord line with that lyric line
        out.push(mergeChordLyric(raw, lines[j]));
        i = j + 1;
        continue;
      } else {
        // Standalone chord-only line — render as inline ChordPro with empty text
        const tokens = raw.trim().split(/\s+/);
        out.push(tokens.map(c => '[' + c + ']').join(' '));
        i++;
        continue;
      }
    }
    // Plain lyric line
    out.push(raw);
    i++;
  }
  return out.join('\n');
}

// ----- ChordPro parser (now accepts section labels) ---------
function parseChordPro(src) {
  const out = [];
  for (const raw of src.split('\n')) {
    const line = raw;
    const trimmed = line.trim();
    if (!trimmed) { out.push({ type: 'blank' }); continue; }

    const dir = trimmed.match(/^\{([a-z_]+)(?::\s*(.+))?\}$/i);
    if (dir) {
      const name = dir[1].toLowerCase();
      const arg = dir[2] ? dir[2].trim() : null;
      if (name.startsWith('end_of_')) { continue; } // silently ignore closing tags
      if (name === 'start_of_verse')   out.push({ type: 'section', section: 'verse',  label: arg || 'Verse' });
      else if (name === 'start_of_chorus') out.push({ type: 'section', section: 'chorus', label: arg || 'Chorus' });
      else if (name === 'start_of_bridge') out.push({ type: 'section', section: 'bridge', label: arg || 'Bridge' });
      else if (name === 'comment') out.push({ type: 'comment', label: arg || '' });
      continue;
    }

    // Inline [Chord]Lyric
    if (trimmed.includes('[')) {
      const parts = [];
      const firstBracket = line.indexOf('[');
      if (firstBracket > 0) parts.push({ chord: '', text: line.slice(0, firstBracket) });
      let i = Math.max(0, firstBracket);
      while (i < line.length) {
        if (line[i] === '[') {
          const close = line.indexOf(']', i);
          if (close === -1) break;
          const chord = line.slice(i + 1, close);
          i = close + 1;
          let next = line.indexOf('[', i);
          if (next === -1) next = line.length;
          parts.push({ chord, text: line.slice(i, next) });
          i = next;
        } else { i++; }
      }
      out.push({ type: 'lyric', parts });
    } else {
      out.push({ type: 'lyric', parts: [{ chord: '', text: line }] });
    }
  }
  return out;
}

// ----- Transpose (unchanged) --------------------------------
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
// User preference: always prefer sharps (F# over Gb, A# over Bb, D# over Eb, etc).
// Source charts may still be written with flats — they'll be normalised to sharps on display.
const FLAT_KEYS = new Set();

function noteIndex(n) {
  const s = SHARPS.indexOf(n); if (s !== -1) return s;
  return FLATS.indexOf(n);
}
function transposeNote(n, semis, useFlats) {
  const idx = noteIndex(n);
  if (idx === -1) return n;
  const i = (((idx + semis) % 12) + 12) % 12;
  return (useFlats ? FLATS : SHARPS)[i];
}
function transposeKey(key, semis) {
  const m = key.match(/^([A-G][b#]?)(m?.*)$/);
  if (!m) return key;
  const root = m[1], rest = m[2] || '';
  const flatGuess  = transposeNote(root, semis, true)  + rest;
  const sharpGuess = transposeNote(root, semis, false) + rest;
  if (FLAT_KEYS.has(flatGuess)) return flatGuess;
  if (FLAT_KEYS.has(sharpGuess)) return sharpGuess;
  return sharpGuess;
}
function transposeChord(chord, semis, useFlats) {
  const m = chord.match(/^([A-G][b#]?)([^\/]*)(?:\/([A-G][b#]?))?$/);
  if (!m) return chord;
  const root = transposeNote(m[1], semis, useFlats);
  const suffix = m[2] || '';
  const bass = m[3] ? '/' + transposeNote(m[3], semis, useFlats) : '';
  return root + suffix + bass;
}
function isFlatContext(key, offset) { return FLAT_KEYS.has(transposeKey(key, offset)); }

//   slider 50 (middle, default) = autoFitSpeed  → scrolls in the song's exact duration
//   slider 0                    = autoFitSpeed / SPEED_SPAN  (slower)
//   slider 100                  = autoFitSpeed * SPEED_SPAN  (faster)
const SPEED_SPAN = 4;   // slider ends give autoFit/4 (very slow) … autoFit*4 (fast)

// ----- Edited chord chart persistence (localStorage) -----------
// When SOURCE_VERSION changes, any localStorage edits that were baked into
// source are cleared so the device picks up the new source instead of stale edits.
const SOURCE_VERSION = '20260729';
(function purgeStaleEdits() {
  const vkey = 'sourceVersion:' + GIG.name;
  if (localStorage.getItem(vkey) !== SOURCE_VERSION) {
    const prefix = 'chartEdit:' + GIG.name + ':';
    for (const k of Object.keys(localStorage)) {
      if (k.startsWith(prefix)) localStorage.removeItem(k);
    }
    localStorage.setItem(vkey, SOURCE_VERSION);
  }
})();

// ----- Font size adjustment (persisted per device, not per song) -----------
const FONT_SIZE_KEY = 'chartFontOffset';
const FONT_SIZE_MIN = -4;
const FONT_SIZE_MAX = 8;
let fontSizeOffset = parseInt(localStorage.getItem(FONT_SIZE_KEY) || '0', 10);

function applyFontSize() {
  // Base clamp is clamp(20px, 2.2vw+8px, 30px) — sized to be glanceable from a
  // few feet away on an iPad stand, not desk-reading distance; offset shifts min/max.
  const min = 20 + fontSizeOffset;
  const max = 30 + fontSizeOffset;
  el.chart.style.fontSize = `clamp(${min}px, 2.2vw + ${8 + fontSizeOffset}px, ${max}px)`;
  el.fontDecBtn.disabled = fontSizeOffset <= FONT_SIZE_MIN;
  el.fontIncBtn.disabled = fontSizeOffset >= FONT_SIZE_MAX;
}

el.fontDecBtn.addEventListener('click', () => {
  if (fontSizeOffset > FONT_SIZE_MIN) {
    fontSizeOffset--;
    localStorage.setItem(FONT_SIZE_KEY, fontSizeOffset);
    applyFontSize();
  }
});
el.fontIncBtn.addEventListener('click', () => {
  if (fontSizeOffset < FONT_SIZE_MAX) {
    fontSizeOffset++;
    localStorage.setItem(FONT_SIZE_KEY, fontSizeOffset);
    applyFontSize();
  }
});

applyFontSize();

// Edits are stored per-song under a stable storage key. The original
// song.chordPro is the fallback when no edit exists.
function editStorageKey(song) {
  return 'chartEdit:' + GIG.name + ':' + (song.artist || '') + ':' + song.title;
}
function getEditedChordPro(song) {
  try {
    return localStorage.getItem(editStorageKey(song));
  } catch (e) { return null; }
}
function saveEditedChordPro(song, text) {
  try { localStorage.setItem(editStorageKey(song), text); }
  catch (e) { console.warn('Could not save chart edit:', e); }
}
function clearEditedChordPro(song) {
  try { localStorage.removeItem(editStorageKey(song)); } catch (e) {}
}
function effectiveChordPro(song) {
  const edited = getEditedChordPro(song);
  return edited !== null ? edited : (song.chordPro || '');
}
function hasEdits(song) {
  return getEditedChordPro(song) !== null;
}

// Collect all chart edits from localStorage and return JSON suitable for
// copy-pasting back to the developer so edits can be baked into source.
function exportAllEdits() {
  const result = {};
  try {
    const prefix = 'chartEdit:' + GIG.name + ':';
    for (let k of Object.keys(localStorage)) {
      if (k.startsWith(prefix)) {
        const key = k.slice(prefix.length);  // "Artist:Title"
        result[key] = localStorage.getItem(k);
      }
    }
  } catch (e) {}
  return result;
}

// ----- Helpers ----------------------------------------------
function formatTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + sec.toString().padStart(2, '0');
}

// ----- Render -----------------------------------------------
function renderGigBar() {
  el.gigName.textContent = GIG.name;
  el.setTabs.innerHTML = '';
  let activeTab = null;
  GIG.sets.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'set-tab' + (i === state.setIndex ? ' active' : '');
    b.textContent = s.name;
    b.addEventListener('click', () => loadSong(i, 0));
    el.setTabs.appendChild(b);
    if (i === state.setIndex) activeTab = b;
  });
  // When the tabs overflow (narrow width + sidebar open), keep the active set
  // scrolled into view instead of clipped by the centered layout.
  if (activeTab) {
    requestAnimationFrame(() => {
      const c = el.setTabs, t = activeTab;
      // position of the tab within the scroll content (rect-based, not offsetParent)
      const rel = (t.getBoundingClientRect().left - c.getBoundingClientRect().left) + c.scrollLeft;
      c.scrollLeft = rel - (c.clientWidth - t.offsetWidth) / 2;
    });
  }
}

// Render the variant tab bar (Chords / Bass / Drums etc.).
// Hidden for songs that have no variants beyond 'chords'.
function renderVariantBar() {
  const song = currentSong();
  const variants = song.variants || {};
  const variantKeys = Object.keys(variants);

  if (variantKeys.length === 0) {
    el.variantBar.hidden = true;
    return;
  }

  el.variantBar.hidden = false;
  el.variantTabs.innerHTML = '';

  const VARIANT_LABELS = { chords: '🎸 Chords', tab: '🎵 Tab', bass: '🎸 Bass', drums: '🥁 Drums' };

  // Only show the Chords tab if the song has real chord content (not a draft-placeholder)
  const hasRealChords = !song.draft && !!effectiveChordPro(song);
  const allVariants = [
    ...(hasRealChords ? [{ key: 'chords', label: '🎸 Chords' }] : []),
    ...variantKeys.map(k => ({
      key: k,
      label: VARIANT_LABELS[k] || (k.charAt(0).toUpperCase() + k.slice(1))
    }))
  ];

  allVariants.forEach(({ key, label }) => {
    const btn = document.createElement('button');
    btn.className = 'variant-tab' + (state.chartVariant === key ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      state.chartVariant = key;
      const s = currentSong();
      const variantValue = key === 'chords' ? null : (s.variants && s.variants[key]);
      // Image-based variants (Array): skip ChordPro parse
      if (Array.isArray(variantValue)) {
        state.parsed = [];  // no chord data
      } else {
        const src = key === 'chords' ? effectiveChordPro(s) : (variantValue || '');
        state.parsed = parseChordPro(preprocessChordChart(src));
      }
      renderVariantBar();
      renderChart();
      el.chart.scrollTop = 0;
      state.virtualScroll = 0;
    });
    el.variantTabs.appendChild(btn);
  });
}

function renderTOC() {
  const tocContent = document.getElementById('toc-content');
  const tocGigName = document.getElementById('tocGigName');
  tocGigName.textContent = GIG.name;
  tocContent.innerHTML = '';

  GIG.sets.forEach((set, setIdx) => {

    set.songs.forEach((song, songIdx) => {

      songDiv.dataset.setIdx = setIdx;

}

// Settings dropdown (chart tools) — overlay
function openSettingsPanel() { el.settingsPanel.hidden = false; el.controlsToggle.classList.add('active'); el.controlsToggle.textContent = 'Settings ▴'; }
function closeSettingsPanel() { el.settingsPanel.hidden = true; el.controlsToggle.classList.remove('active'); el.controlsToggle.textContent = 'Settings ▾'; }
el.controlsToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  el.settingsPanel.hidden ? openSettingsPanel() : closeSettingsPanel();
});
document.addEventListener('click', (e) => {
  if (!el.settingsPanel.hidden && !e.target.closest('.settings-dd')) closeSettingsPanel();
});

function loadSong(setIdx, songIdx) {
  // If we're navigating away while editing, commit and exit edit mode first
  if (state.editMode) exitEditMode({ silent: true });

  state.setIndex = Math.max(0, Math.min(GIG.sets.length - 1, setIdx));
  const songs = currentSet().songs;
  state.songIndex = Math.max(0, Math.min(songs.length - 1, songIdx));
  const song = currentSong();
  // If song is draft (no real chord content) but has image variants, default to first variant
  const songVariants = song.variants ? Object.keys(song.variants) : [];
  state.chartVariant = (song.draft && songVariants.length > 0) ? songVariants[0] : 'chords';
  // Read either the saved edit or the original chord chart
  const sourceChordPro = effectiveChordPro(song);
  if (state.chartVariant !== 'chords' && song.variants && Array.isArray(song.variants[state.chartVariant])) {
    state.parsed = [];  // image variant — no chord data needed
  } else {
    const src = sourceChordPro ? preprocessChordChart(sourceChordPro) : '';
    state.parsed = parseChordPro(src);
  }
  state.transposeOffset = song.transpose || 0;   // per-song default transpose
  state.currentBeat = -1;
  const [num] = (song.time || '4/4').split('/').map(Number);
  state.beatsPerBar = num || 4;
  togglePlay(false);
  renderGigBar();
  renderTopbar();
  renderBeats();
  renderVariantBar();
  renderChart();
  renderTOC();
  el.chart.scrollTop = 0;
  state.virtualScroll = 0;

  // If song has durationSec, calibrate the auto-fit speed so that the slider's
  // middle scrolls the chart end-to-end in exactly that time.
  if (song.durationSec && sourceChordPro) {
    calibrateScrollBase(song);
  } else {
    // No duration to fit — pick a sensible default auto-fit speed.
    state.autoFitSpeed = 36;
    applySliderSpeed();
  }
  // One-shot paint of the read-line highlight + progress (the rAF loop only
  // runs while playing, so nothing else refreshes these until then).
  requestAnimationFrame(() => { updateHighlight(); updateProgress(); });
}

// Derive the per-song auto-fit speed once layout has settled. Retries across
// frames until the chart actually has a scrollable height (first paint / fonts
// can lag a frame or two), so calibration never silently falls back.
function calibrateScrollBase(song, tries) {
  tries = tries || 0;
  const scrollable = el.chart.scrollHeight - el.chart.clientHeight;
  if (scrollable > 0) {
    state.autoFitSpeed = scrollable / song.durationSec;
    applySliderSpeed();   // keep the slider position, recompute speed for this song
  } else if (tries < 30) {
    requestAnimationFrame(() => calibrateScrollBase(song, tries + 1));
  }
}

function renderTopbar() {
  const s = currentSong();
  el.title.textContent = s.title;
  el.artist.textContent = s.artist ? ' — ' + s.artist : '';
  el.draftBadge.hidden = !s.draft;
  el.editedBadge.hidden = !hasEdits(s);
  el.resetEditBtn.hidden = !hasEdits(s);
  el.bpm.textContent = s.bpm;
  el.time.textContent = s.time;
  updateKey();
}

// ----- Inline chord chart editing -----------------------------
// Toggle to a full-area textarea, auto-save on input (debounced).
function enterEditMode() {
  if (state.editMode) return;
  const song = currentSong();
  togglePlay(false);
  closeSettingsPanel();
  state.editMode = true;
  el.editBtn.textContent = '✓ Done';
  el.editBtn.classList.add('editing');

  // Replace chart contents with a textarea
  el.chart.innerHTML = '';
  el.chart.style.padding = '0';
  el.chart.style.overflow = 'hidden';

  const ta = document.createElement('textarea');
  ta.id = 'chartEditor';
  ta.className = 'chart-editor';
  ta.spellcheck = false;
  ta.autocapitalize = 'off';
  ta.autocorrect = 'off';
  ta.value = effectiveChordPro(song);
  el.chart.appendChild(ta);

  const hint = document.createElement('div');
  hint.className = 'edit-hint';
  hint.textContent = 'Edits autosave locally · tap Done to render';
  el.chart.parentNode.appendChild(hint);
  hint.id = 'editHint';

  // Auto-save debounced 300ms
  ta.addEventListener('input', () => {
    clearTimeout(state.editSaveTimer);
    state.editSaveTimer = setTimeout(() => {
      const songNow = currentSong();
      saveEditedChordPro(songNow, ta.value);
      el.editedBadge.hidden = false;
      el.resetEditBtn.hidden = false;
    }, 300);
  });

  // Focus the textarea so iPad keyboard pops up immediately
  setTimeout(() => ta.focus(), 50);
}

function exitEditMode(opts) {
  if (!state.editMode) return;
  opts = opts || {};
  // Flush any pending save
  clearTimeout(state.editSaveTimer);
  const song = currentSong();
  const ta = document.getElementById('chartEditor');
  if (ta) saveEditedChordPro(song, ta.value);

  state.editMode = false;
  el.editBtn.textContent = 'Edit';
  el.editBtn.classList.remove('editing');
  const hint = document.getElementById('editHint');
  if (hint) hint.remove();
  el.chart.style.padding = '';
  el.chart.style.overflow = '';

  if (!opts.silent) {
    // Re-parse and re-render with the new source
    const src = preprocessChordChart(effectiveChordPro(song));
    state.parsed = parseChordPro(src);
    renderChart();
    el.editedBadge.hidden = !hasEdits(song);
    el.resetEditBtn.hidden = !hasEdits(song);
    // Recalibrate scroll speed since chart length may have changed
    if (song.durationSec) {
      calibrateScrollBase(song);
    }
    requestAnimationFrame(() => { updateHighlight(); updateProgress(); });
  }
}

function resetEditsForCurrentSong() {
  const song = currentSong();
  if (!hasEdits(song)) return;
  if (!confirm('Discard your edits to "' + song.title + '" and restore the original chord chart?')) return;
  clearEditedChordPro(song);
  if (state.editMode) {
    // Refresh the textarea in place
    const ta = document.getElementById('chartEditor');
    if (ta) ta.value = song.chordPro || '';
  }
  el.editedBadge.hidden = true;
  el.resetEditBtn.hidden = true;
  // Re-parse from original and re-render if not in edit mode
  if (!state.editMode) {
    const src = preprocessChordChart(song.chordPro || '');
    state.parsed = parseChordPro(src);
    renderChart();
  }
}

function updateKey() {
  const s = currentSong();
  el.key.textContent = transposeKey(s.key, state.transposeOffset);
  el.transOffset.textContent = (state.transposeOffset > 0 ? '+' : '') + state.transposeOffset;
}

function renderBeats() {
  el.beats.innerHTML = '';
  for (let i = 0; i < state.beatsPerBar; i++) {
    const d = document.createElement('div');
    d.className = 'beat' + (i === 0 ? ' downbeat' : '');
    el.beats.appendChild(d);
  }
}

function renderChart() {
  const s = currentSong();
  el.chart.innerHTML = '';

  // Image-based variant (PDF pages) — render scrollable full-width images
  if (state.chartVariant !== 'chords' && s.variants && Array.isArray(s.variants[state.chartVariant])) {
    const pages = s.variants[state.chartVariant];
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding: 16px 8px; display: flex; flex-direction: column; gap: 8px; align-items: center;';
    pages.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Page ' + (i + 1);
      // min-height holds the page's place while it loads (avoids the chart
      // jumping/reflowing mid-scroll as each image pops in), cleared on load.
      img.style.cssText = 'width: 100%; max-width: 900px; min-height: 400px; background: var(--chip-bg); border: 1px solid var(--border); border-radius: var(--r-ctl); display: block;';
      img.loading = i === 0 ? 'eager' : 'lazy';
      img.decoding = 'async';
      img.addEventListener('load', () => { img.style.minHeight = ''; img.style.background = ''; }, { once: true });
      // Bad venue wifi / an image missing from the offline cache shouldn't leave
      // a broken-image glyph sitting mid-song with no way to recover.
      img.addEventListener('error', () => {
        const errCard = document.createElement('div');
        errCard.className = 'draft-card';
        errCard.style.margin = '8px auto';
        errCard.innerHTML = '<div class="label" style="background: var(--muted);">PAGE ' + (i + 1) + '</div>' +
          '<h2>Image didn’t load</h2>' +
          '<p>Check your connection, or it may not be cached for offline use yet.</p>';
        const retryBtn = document.createElement('button');
        retryBtn.className = 'btn primary';
        retryBtn.style.marginTop = '10px';
        retryBtn.textContent = '↻ Retry';
        retryBtn.addEventListener('click', () => { errCard.replaceWith(img); img.src = src + (src.includes('?') ? '&' : '?') + 'retry=' + Date.now(); });
        errCard.appendChild(retryBtn);
        img.replaceWith(errCard);
      }, { once: true });
      wrap.appendChild(img);
    });
    el.chart.appendChild(wrap);
    return;
  }

  if (s.draft) {
    const card = document.createElement('div');
    card.className = 'draft-card';
    card.innerHTML = '<div class="label">DRAFT</div>' +
                     '<h2>' + escapeHtml(s.title) + '</h2>' +
                     '<p>This song is in draft. The chord chart has not been entered yet.</p>' +
                     (s.draftNote ? '<div class="ref">' + escapeHtml(s.draftNote) + '</div>' : '');
    el.chart.appendChild(card);
    return;
  }

  const useFlats = isFlatContext(s.key, state.transposeOffset);
  state.parsed.forEach((node, i) => {
    if (node.type === 'blank') {
      if (state.chordsOnly) return;   // skip spacer lines in the condensed view
      const div = document.createElement('div');
      div.className = 'line blank';
      div.dataset.lineIndex = i;
      el.chart.appendChild(div);
      return;
    }
    if (node.type === 'section') {
      const div = document.createElement('div');
      div.className = 'line section';
      div.dataset.lineIndex = i;
      div.dataset.section = node.section;
      div.textContent = node.label;
      el.chart.appendChild(div);
      return;
    }
    if (node.type === 'comment') {
      const div = document.createElement('div');
      div.className = 'line comment';
      div.dataset.lineIndex = i;
      div.textContent = node.label;
      el.chart.appendChild(div);
      return;
    }
    if (node.type === 'lyric') {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      lineDiv.dataset.lineIndex = i;

      // Chord-only line (Intro/Interlude/Outro progressions): every part has
      // a chord and no real lyric text. Render as evenly-spaced chord chips.
      const isChordOnly = node.parts.length > 0
        && node.parts.every(p => p.chord && (!p.text || /^\s*$/.test(p.text)));
      if (isChordOnly) {
        lineDiv.classList.add('chord-only');
        const chordRow = document.createElement('div');
        chordRow.className = 'chord-row chord-only-row';
        for (const p of node.parts) {
          const span = document.createElement('span');
          span.className = 'chord-token';
          span.textContent = transposeChord(p.chord, state.transposeOffset, useFlats);
          chordRow.appendChild(span);
        }
        lineDiv.appendChild(chordRow);
        el.chart.appendChild(lineDiv);
        return;
      }

      // Chords-only summary view: collapse this line down to its chord
      // sequence (adjacent duplicates merged), lyrics dropped entirely.
      if (state.chordsOnly) {
        const chords = [];
        for (const p of node.parts) {
          if (!p.chord) continue;
          const t = transposeChord(p.chord, state.transposeOffset, useFlats);
          if (chords[chords.length - 1] !== t) chords.push(t);
        }
        if (!chords.length) return;   // pure-lyric line: nothing to summarise
        lineDiv.classList.add('chord-only');
        const chordRow = document.createElement('div');
        chordRow.className = 'chord-row chord-only-row';
        for (const t of chords) {
          const span = document.createElement('span');
          span.className = 'chord-token';
          span.textContent = t;
          chordRow.appendChild(span);
        }
        lineDiv.appendChild(chordRow);
        el.chart.appendChild(lineDiv);
        return;
      }

      // Mixed chord+lyric: existing column-aligned rendering
      let chordLine = '', lyricLine = '';
      for (const p of node.parts) {
        const t = p.chord ? transposeChord(p.chord, state.transposeOffset, useFlats) : '';
        while (chordLine.length < lyricLine.length) chordLine += ' ';
        chordLine += t;
        lyricLine += p.text;
        while (lyricLine.length < chordLine.length) lyricLine += ' ';
      }
      const hasChord = node.parts.some(p => p.chord);
      if (hasChord) {
        const chordRow = document.createElement('div');
        chordRow.className = 'chord-row';
        chordRow.textContent = chordLine || ' ';
        lineDiv.appendChild(chordRow);
      }
      const lyricRow = document.createElement('div');
      lyricRow.className = 'lyric-row';
      lyricRow.textContent = lyricLine || ' ';
      lineDiv.appendChild(lyricRow);
      el.chart.appendChild(lineDiv);
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ----- Highlight & scroll -----------------------------------
function updateHighlight() {
  const playheadY = el.chart.clientHeight * 0.12;
  const lines = el.chart.querySelectorAll('.line');
  const chartTop = el.chart.getBoundingClientRect().top;
  let active = -1;
  for (let i = 0; i < lines.length; i++) {
    const r = lines[i].getBoundingClientRect();
    const rel = { top: r.top - chartTop, bottom: r.bottom - chartTop };
    if (rel.top <= playheadY && rel.bottom >= playheadY) { active = i; }
  }
  lines.forEach((l, i) => l.classList.toggle('active', i === active));
}

function updateProgress() {
  const max = el.chart.scrollHeight - el.chart.clientHeight;
  if (max <= 0) {
    el.progressFill.style.width = '0%';
    el.elapsedTime.textContent = '0:00';
    el.remainingTime.textContent = '-0:00';
    return;
  }
  const pct = Math.max(0, Math.min(1, el.chart.scrollTop / max));
  el.progressFill.style.width = (pct * 100).toFixed(2) + '%';
  // Prefer the song's true duration if set, otherwise derive from scroll speed
  const song = currentSong();
  const totalSec = (song && song.durationSec) ? song.durationSec : (max / state.scrollSpeed);
  const elapsedSec = pct * totalSec;
  el.elapsedTime.textContent = formatTime(elapsedSec);
  el.remainingTime.textContent = '-' + formatTime(totalSec - elapsedSec);
}

// The animation loop only runs while auto-scrolling. When paused it stops
// entirely (no idle 60fps churn) — a real battery win on the iPad; UI stays in
// sync via one-shot updates on manual scroll / song load instead.
let rafId = null;
function startLoop() {
  if (rafId === null) { state.lastTs = 0; rafId = requestAnimationFrame(tick); }
}
function tick(ts) {
  rafId = null;   // this frame has fired; only reschedule below if still playing
  if (!state.lastTs) state.lastTs = ts;
  const dt = (ts - state.lastTs) / 1000;
  state.lastTs = ts;
  if (!state.playing) return;
  state.virtualScroll += state.scrollSpeed * dt;
  el.chart.scrollTop = state.virtualScroll;
  updateHighlight();
  updateMetronome(ts);
  updateProgress();
  if (state.virtualScroll >= el.chart.scrollHeight - el.chart.clientHeight - 1) { togglePlay(false); return; }
  rafId = requestAnimationFrame(tick);
}

function updateMetronome(ts) {
  if (!state.playing) {
    if (state.currentBeat !== -1) {
      el.beats.querySelectorAll('.beat').forEach(b => b.classList.remove('active'));
      state.currentBeat = -1;
    }
    return;
  }
  const msPerBeat = 60000 / currentSong().bpm;
  const elapsed = ts - state.metroStart;
  const beatIdx = Math.floor(elapsed / msPerBeat) % state.beatsPerBar;
  if (beatIdx !== state.currentBeat) {
    state.currentBeat = beatIdx;
    el.beats.querySelectorAll('.beat').forEach((b, i) => b.classList.toggle('active', i === beatIdx));
  }
}

// ----- Controls ---------------------------------------------
function togglePlay(force) {
  const next = typeof force === 'boolean' ? force : !state.playing;
  state.playing = next;
  el.playBtn.textContent = next ? '⏸ Pause' : '▶ Play';
  el.playBtn.classList.toggle('active', next);
  if (next) {
    state.metroStart = performance.now();
    state.currentBeat = -1;
    startLoop();
  } else {
    // Loop is now idle; clear the metronome beats it would have reset.
    el.beats.querySelectorAll('.beat').forEach(b => b.classList.remove('active'));
    state.currentBeat = -1;
  }
}
el.playBtn.addEventListener('click', () => togglePlay());
el.restartBtn.addEventListener('click', () => { el.chart.scrollTop = 0; state.virtualScroll = 0; togglePlay(false); });

// Manual scrolling does NOT pause autoscroll — it just repositions it, so the
// scroll continues from wherever you drag to. We tell a real manual scroll from
// autoscroll's own sub-pixel motion by how far scrollTop jumps from the expected
// position: tick keeps scrollTop within ~1px of virtualScroll, so a jump beyond
// a few px is the user. (Small programmatic drift is left alone to preserve the
// fractional accumulator, otherwise slow speeds < 1px/frame would stall.)
let uiSyncRaf = null;
el.chart.addEventListener('scroll', () => {
  if (state.playing) {
    if (Math.abs(el.chart.scrollTop - state.virtualScroll) > 6) {
      state.virtualScroll = el.chart.scrollTop;   // user moved — follow, keep playing
    }
    return;
  }
  state.virtualScroll = el.chart.scrollTop;
  if (uiSyncRaf === null) {
    uiSyncRaf = requestAnimationFrame(() => { uiSyncRaf = null; updateHighlight(); updateProgress(); });
  }
});

// Tap the chart to play / pause (skip while editing, or when selecting text).
el.chart.addEventListener('click', () => {
  if (state.editMode) return;
  const sel = window.getSelection && window.getSelection();
  if (sel && sel.type === 'Range' && String(sel).length) return;   // don't hijack text selection
  togglePlay();
});

// Edit mode toggle + reset
el.editBtn.addEventListener('click', () => {
  if (state.editMode) exitEditMode();
  else enterEditMode();
});
el.resetEditBtn.addEventListener('click', resetEditsForCurrentSong);

el.exportEditsBtn.addEventListener('click', () => {
  const edits = exportAllEdits();
  const count = Object.keys(edits).length;
  if (count === 0) {
    alert("Nothing to export — you haven't edited any charts yet.");
    return;
  }
  const text = JSON.stringify(edits, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    el.exportEditsBtn.textContent = '✓ Copied!';
    setTimeout(() => { el.exportEditsBtn.textContent = '⬆ Export'; }, 2000);
  }).catch(() => {
    // Fallback for browsers that restrict clipboard
    prompt('Copy this and paste it into index.html:', text);
  });
});

el.transUp.addEventListener('click', () => {
  if (state.editMode) return;  // transpose only applies to rendered view
  state.transposeOffset = Math.min(state.transposeOffset + 1, 11);
  updateKey(); renderChart();
});
el.transDown.addEventListener('click', () => {
  if (state.editMode) return;
  state.transposeOffset = Math.max(state.transposeOffset - 1, -11);
  updateKey(); renderChart();
});

function fmtETA(pxPerSec) {
  const scrollable = el.chart.scrollHeight - el.chart.clientHeight;
  if (!scrollable || !pxPerSec) return '–:––';
  const secs = Math.round(scrollable / pxPerSec);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m + ':' + String(s).padStart(2, '0');
}

// Map the slider (0–100, middle 50) to an actual scroll speed, exponential
// around the song's auto-fit speed so the middle scrolls in the song's exact
// duration and each half doubles / halves it. Updates the ETA label.
function applySliderSpeed() {
  const v = +el.speed.value;
  const mult = Math.pow(SPEED_SPAN, (v - SPEED_MID) / SPEED_MID);
  state.scrollSpeed = state.autoFitSpeed * mult;
  el.speedLabel.textContent = fmtETA(state.scrollSpeed);
}

el.speed.addEventListener('input', applySliderSpeed);

// Prev / Next — navigate within the current set, with end-of-set handoff
el.prevSong.addEventListener('click', () => {
  if (state.songIndex > 0) {
    loadSong(state.setIndex, state.songIndex - 1);
  } else if (state.setIndex > 0) {
    // Go to last song of previous set
    const prevSet = state.setIndex - 1;
    loadSong(prevSet, GIG.sets[prevSet].songs.length - 1);
  }
});
el.nextSong.addEventListener('click', () => {
  const songs = currentSet().songs;
  if (state.songIndex < songs.length - 1) {
    loadSong(state.setIndex, state.songIndex + 1);
  } else if (state.setIndex < GIG.sets.length - 1) {
    // End-of-set handoff
    openSetCompleteModal();
  } else {
    // End of gig
    openSetCompleteModal(true);
  }
});

// Set complete modal
function openSetCompleteModal(gigComplete) {
  if (gigComplete) {
    el.modalSubtitle.textContent = 'Gig Complete';
    el.modalMeta.textContent = 'You have finished the last song of the gig.';
    el.modalStart.hidden = true;
  } else {
    const nextSet = GIG.sets[state.setIndex + 1];
    el.modalSubtitle.textContent = currentSet().name + ' Complete';
    el.modalMeta.textContent = 'Next up: ' + nextSet.name + ' (' + nextSet.songs.length + ' songs)';
    el.modalStart.hidden = false;
    el.modalStart.textContent = 'Start ' + nextSet.name;
  }
  el.modal.classList.add('open');
}
el.modalCancel.addEventListener('click', () => el.modal.classList.remove('open'));
el.modalStart.addEventListener('click', () => {
  el.modal.classList.remove('open');
  loadSong(state.setIndex + 1, 0);
});

// Note: song picker removed — navigation via sidebar TOC + ‹/› buttons

// Sidebar toggle (mobile)
const tocToggle = document.getElementById('toc-toggle');
const tocSidebar = document.getElementById('toc-sidebar');
if (tocToggle) {
  tocToggle.addEventListener('click', e => {
    e.stopPropagation();
    tocSidebar.classList.toggle('open');
  });
}
// Close sidebar when clicking outside on mobile
document.addEventListener('click', e => {
  if (tocSidebar && !tocSidebar.contains(e.target) && e.target !== tocToggle) {
    tocSidebar.classList.remove('open');
  }
});

// Sidebar collapse/expand — permanent toggle in the metronome bar (+ in-sidebar ◀)
const tocCollapseBtn = document.getElementById('toc-collapse');
const setlistToggle = document.getElementById('setlistToggle');
function updateSetlistToggle() {
  if (!setlistToggle) return;
  // "active" = setlist currently showing. On desktop/iPad that's simply the
  // (not-)collapsed grid state; on mobile it's whether the drawer is open.
  const open = window.matchMedia('(max-width: 767px)').matches
    ? tocSidebar.classList.contains('open')
    : !document.body.classList.contains('sidebar-collapsed');
  setlistToggle.classList.toggle('active', open);
}
function collapseSidebar() { document.body.classList.add('sidebar-collapsed'); updateSetlistToggle(); }
function expandSidebar() { document.body.classList.remove('sidebar-collapsed'); updateSetlistToggle(); }
function toggleSidebar() {
  if (window.matchMedia('(max-width: 767px)').matches) {
    tocSidebar.classList.toggle('open');   // mobile: slide-in drawer
  } else {
    document.body.classList.toggle('sidebar-collapsed');   // desktop/iPad: grid collapse
  }
  updateSetlistToggle();
}
if (tocCollapseBtn) tocCollapseBtn.addEventListener('click', collapseSidebar);
if (setlistToggle) setlistToggle.addEventListener('click', (e) => { e.stopPropagation(); toggleSidebar(); });
// Re-sync the highlight on resize / orientation change (mobile drawer vs desktop grid).
window.addEventListener('resize', updateSetlistToggle);
updateSetlistToggle();

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === '+' || e.key === '=') el.transUp.click();
  else if (e.key === '-' || e.key === '_') el.transDown.click();
  else if (e.key === 'n' || e.key === 'N') el.nextSong.click();
  else if (e.key === 'p' || e.key === 'P') el.prevSong.click();
});

// ----- Screen Wake Lock -------------------------------------
// Keep the iPad awake during a set. The OS releases the lock whenever the tab
// is hidden, so we re-request on visibility change. Toggle (default on) lets the
// user trade the reliability for battery when they're not performing.
let wakeLock = null;
let keepAwake = localStorage.getItem('keepAwake') !== 'false';   // default true
const wakeToggle = document.getElementById('wakeToggle');
function renderWakeToggle() {
  if (!wakeToggle) return;
  wakeToggle.textContent = '🔆 Keep screen awake: ' + (keepAwake ? 'On' : 'Off');
  wakeToggle.classList.toggle('active', keepAwake);
}
async function acquireWakeLock() {
  if (!keepAwake || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { /* denied (no gesture yet, low battery, unsupported) — harmless */ }
}
async function releaseWakeLock() {
  try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
// First user gesture satisfies browsers that require one before granting the lock.
window.addEventListener('pointerdown', function onceGesture() {
  acquireWakeLock();
  window.removeEventListener('pointerdown', onceGesture);
});
// ----- Chords-only summary view ------------------------------
// Hides lyrics and condenses each line to its chord sequence, per section.
const chordsOnlyToggle = document.getElementById('chordsOnlyToggle');
function renderChordsOnlyToggle() {
  if (!chordsOnlyToggle) return;
  chordsOnlyToggle.textContent = '🎸 Chords only: ' + (state.chordsOnly ? 'On' : 'Off');
  chordsOnlyToggle.classList.toggle('active', state.chordsOnly);
}
if (chordsOnlyToggle) chordsOnlyToggle.addEventListener('click', () => {
  state.chordsOnly = !state.chordsOnly;
  localStorage.setItem('chordsOnly', state.chordsOnly ? 'true' : 'false');
  renderChordsOnlyToggle();
  renderChart();
});
renderChordsOnlyToggle();

if (wakeToggle) wakeToggle.addEventListener('click', () => {
  keepAwake = !keepAwake;
  localStorage.setItem('keepAwake', keepAwake ? 'true' : 'false');
  renderWakeToggle();
  if (keepAwake) acquireWakeLock(); else releaseWakeLock();
});
renderWakeToggle();
acquireWakeLock();

// Init
loadSong(0, 0);

// Offline support — register service worker (no-op on file:// or unsupported browsers)
// Cache-bust sw.js URL so Safari on iOS always fetches the latest version.
const SW_BUILD = '20260729b';
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=' + SW_BUILD).catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
</body>
