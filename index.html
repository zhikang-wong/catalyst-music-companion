<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gigging Companion — WN Catalyst Gig 4</title>
<style>
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --fg: #1a1d22;
    --muted: #6b7280;
    --accent: #d97706;
    --highlight: rgba(217,119,6,0.12);
    --chord: #1d4ed8;
    --section: #b45309;
    --border: #e5e7eb;
    --chip-bg: #f3f4f6;
    --beat-idle: #d1d5db;
    --draft: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto auto auto 1fr auto;
    height: 100vh;
    overflow: hidden;
  }

  /* Left sidebar table of contents */
  .toc-sidebar {
    grid-column: 1;
    grid-row: 1 / -1;
    background: #f5f3f0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

  .toc-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .toc-header h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: #1f2937;
  }

  .toc-toggle {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--fg);
    padding: 4px 8px;
    display: none;
    border-radius: 6px;
  }

  .toc-toggle:hover {
    background: var(--chip-bg);
  }

  .toc-content {
    flex: 1;
    overflow-y: auto;
  }

  .toc-set-title {
    padding: 8px 14px;
    font-weight: 600;
    color: #374151;
    background: #ede9e4;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .toc-set.current .toc-set-title {
    background: var(--accent);
    color: #ffffff;
  }

  .toc-songs {
    display: flex;
    flex-direction: column;
  }

  .toc-song {
    padding: 6px 20px;
    cursor: pointer;
    color: #4b5563;
    user-select: none;
    font-size: 13px;
    transition: background 0.12s;
  }

  .toc-song:hover {
    background: #e5dfd8;
  }

  .toc-song.current {
    background: #fef3c7;
    color: #1f2937;
    font-weight: 500;
  }

  /* Gig bar — top strip with gig name + set tabs */
  .gigbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
  }
  .gig-name { font-weight: 700; font-size: 15px; }
  .set-tabs { display: flex; gap: 4px; }
  .set-tab {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .set-tab:hover { background: var(--chip-bg); }
  .set-tab.active {
    background: var(--accent);
    color: #ffffff;
  }
  .song-picker-wrap { margin-left: auto; position: relative; }
  .song-picker-btn {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: var(--fg);
  }
  .song-picker-menu {
    position: absolute;
    right: 0; top: calc(100% + 4px);
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    padding: 6px;
    min-width: 280px;
    max-height: 60vh;
    overflow-y: auto;
    z-index: 10;
    display: none;
  }
  .song-picker-menu.open { display: block; }
  .picker-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .picker-item:hover { background: var(--chip-bg); }
  .picker-item.current { background: var(--highlight); }
  .picker-num { color: var(--muted); min-width: 22px; text-align: right; }
  .picker-title { flex: 1; }
  .picker-badge {
    font-size: 10px;
    background: var(--draft);
    color: #fff;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* Song / control top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .song-meta { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .song-title { font-size: 18px; font-weight: 600; }
  .song-artist { color: var(--muted); font-size: 14px; }
  .song-pos { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .draft-badge {
    background: var(--draft);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .meta-chip {
    background: var(--chip-bg);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .meta-chip strong { color: var(--fg); margin-left: 4px; }

  .btn {
    background: #ffffff;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s, border-color 0.12s;
  }
  .btn:hover { background: var(--chip-bg); border-color: #d1d5db; }
  .btn:active { transform: translateY(1px); }
  .btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 600; }
  .btn.icon { padding: 8px 14px; font-size: 18px; min-width: 44px; }

  .transpose { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .song-switcher { display: flex; gap: 6px; }

  /* Beat-dots metronome */
  .beats {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 6px 14px;
    background: var(--chip-bg);
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .beat {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--beat-idle);
    transition: background 80ms ease, transform 80ms ease, box-shadow 80ms ease;
  }
  .beat.downbeat { width: 16px; height: 16px; }
  .beat.active { background: var(--accent); transform: scale(1.15); }
  .beat.downbeat.active { box-shadow: 0 0 12px rgba(217,119,6,0.55); }

  /* Progress strip */
  .progress-strip {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-track {
    flex: 1; height: 5px;
    background: var(--chip-bg);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 80ms linear;
  }
  .progress-time {
    font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 44px;
  }
  .progress-time.remaining { text-align: right; }

  /* Chart */
  .chart-wrap { flex: 1; overflow: hidden; position: relative; }
  .chart {
    height: 100%;
    overflow-y: auto;
    padding: 12vh 28px 60vh;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 22px;
    line-height: 1.5;
  }
  .chart::-webkit-scrollbar { width: 6px; }
  .chart::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  .line {
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.18s;
  }
  .line.active { background: var(--highlight); }
  .line.section {
    color: var(--section);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 13px;
    margin-top: 22px;
    padding-top: 6px;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .line.comment {
    color: var(--muted);
    font-style: italic;
    font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    margin-top: 8px;
  }
  .line.blank { height: 14px; }
  .chord-row { color: var(--chord); font-weight: 700; white-space: pre; }
  .lyric-row { white-space: pre; }

  .playhead {
    position: absolute;
    left: 0; right: 0;
    top: 12%;
    height: 0;
    border-top: 1px dashed rgba(217,119,6,0.30);
    pointer-events: none;
    z-index: 1;
  }

  /* Draft empty-state */
  .draft-card {
    margin: 40px auto;
    max-width: 520px;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .draft-card .label {
    background: var(--draft);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 4px 10px;
    border-radius: 10px;
    display: inline-block;
  }
  .draft-card h2 { margin: 14px 0 6px; font-size: 22px; }
  .draft-card p { color: var(--muted); margin: 6px 0; font-size: 14px; }
  .draft-card .ref {
    margin-top: 14px;
    background: var(--chip-bg);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 13px;
    color: var(--fg);
    word-break: break-all;
  }

  /* Footer */
  .footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  /* Dynamic section jump buttons (built from current song's chord chart) */
  .section-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
    align-items: center;
    min-width: 0;
  }
  .section-btn {
    background: #ffffff;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .section-btn:hover { background: var(--chip-bg); border-color: #d1d5db; }
  .section-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .section-btns:empty::before {
    content: 'No sections in this song';
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }
  .speed-row {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 13px;
  }
  .speed-row input[type=range] { flex: 1; max-width: 320px; accent-color: var(--accent); }
  .help { color: var(--muted); font-size: 11px; text-align: right; }
  .help kbd {
    background: var(--chip-bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px;
    font-size: 10px; color: var(--fg);
  }

  /* Set complete modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,20,25,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 36px;
    width: min(440px, 90vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-title { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; }
  .modal-subtitle { font-size: 22px; font-weight: 700; margin: 10px 0 6px; }
  .modal-meta { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }

  /* Main content area spans column 2 */
  .gigbar, .topbar, .progress-strip, .chart-wrap, .footer {
    grid-column: 2;
  }

  /* Mobile: sidebar becomes slide-in drawer */
  @media (max-width: 767px) {
    body {
      grid-template-columns: 1fr;
    }

    .toc-sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: 280px;
      z-index: 999;
      transform: translateX(-100%);
      transition: transform 0.3s ease-out;
      grid-column: auto;
      grid-row: auto;
    }

    .toc-sidebar.open {
      transform: translateX(0);
    }

    .toc-toggle {
      display: block;
    }

    .gigbar, .topbar, .progress-strip, .chart-wrap, .footer {
      grid-column: 1;
    }
  }

  @media (min-width: 768px) {
    .toc-toggle {
      display: none;
    }
  }
</style>
</head>

    <div class="song-switcher">

      <button class="btn" id="nextSong">Next ›</button>

  </div>

  <!-- Progress strip -->
  <div class="progress-strip">

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-time remaining" id="remainingTime">-0:00</span>
  </div>

  <!-- Chart -->
  <div class="chart-wrap">
    <div class="playhead"></div>
    <div class="chart" id="chart"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="controls">
      <button class="btn" id="playBtn">▶ Play</button>
      <button class="btn" id="restartBtn">⟲ Restart</button>
      <div class="sep"></div>
      <div class="section-btns" id="sectionBtns"></div>
    </div>
    <div class="speed-row">
      <span>Scroll speed</span>
      <input type="range" id="speedSlider" min="10" max="120" value="36" />
      <span id="speedLabel">36 px/s</span>
      <span class="help" style="margin-left:auto">
        <kbd>Space</kbd> play · <kbd>+</kbd>/<kbd>−</kbd> transpose · <kbd>N</kbd>/<kbd>P</kbd> next/prev
      </span>
    </div>
  </div>

  <!-- Set complete modal -->
  <div class="modal-overlay" id="setCompleteModal">
    <div class="modal-card">
      <div class="modal-title">Set Complete</div>
      <div class="modal-subtitle" id="modalSubtitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-buttons">
        <button class="btn" id="modalCancel">Stay on song</button>
        <button class="btn primary" id="modalStart">Start next set</button>
      </div>
    </div>
  </div>

// ----- Two-line chord-over-lyric parser ---------------------
// Detects: section headers, chord-only lines paired with lyric lines,
// passes through real ChordPro [Chord]Lyric lines untouched.

const CHORD_TOKEN_RE = /^\(?[A-G][b#]?(?:m|maj|min|sus|add|aug|dim|°|Δ|7|9|11|13|6|5|4|2|3)*\d*(?:\/[A-G][b#]?(?:m|maj|min)*\d*)?\)?$/;

function detectSection(line) {
  const t = line.trim();
  if (!t) return null;
  const lower = t.toLowerCase();
  if (/^intro\b/.test(lower)) return { section: 'intro', label: t };
  if (/^outro\b/.test(lower)) return { section: 'outro', label: t };
  if (/^end(ing)?\b/.test(lower)) return { section: 'ending', label: t };
  if (/^verse\b/.test(lower)) return { section: 'verse', label: t };
  if (/^pre[-\s]?chorus\b/.test(lower)) return { section: 'prechorus', label: 'Pre-Chorus' };
  if (/^post[-\s]?chorus\b/.test(lower)) return { section: 'chorus', label: t };
  if (/^last\s*chorus\b/.test(lower)) return { section: 'chorus', label: t };
  if (/^quiet\s*chorus\b/.test(lower)) return { section: 'chorus', label: t };
  if (/^chorus\b/.test(lower)) return { section: 'chorus', label: t };
  if (/^bridge\b/.test(lower)) return { section: 'bridge', label: t };
  if (/^interlude\b/.test(lower)) return { section: 'interlude', label: t };
  if (/^solo\b/.test(lower)) return { section: 'solo', label: t };
  if (/^transition\b/.test(lower)) return { section: 'transition', label: t };
  if (/^repeat\b/.test(lower)) return { section: 'repeat', label: t };
  if (/^structure\b/.test(lower)) return { section: 'structure', label: t };
  if (/^chord\s*overview\b/.test(lower)) return { section: 'comment', label: t };
  if (/^whole\s*song\b/.test(lower)) return { section: 'comment', label: t };
  if (/^core\b/.test(lower) && t.length < 10) return { section: 'verse', label: t };
  return null;
}

function isChordToken(t) { return CHORD_TOKEN_RE.test(t); }

function isChordLine(line) {
  const t = line.trim();
  if (!t) return false;
  // Reject lines that contain CJK or other non-ASCII letters (those are lyrics)
  if (/[^\x00-\x7F]/.test(t)) return false;
  const tokens = t.split(/\s+/);
  if (!tokens.length) return false;
  // Need at least one true chord token
  if (!tokens.some(tk => /^[A-G]/.test(tk))) return false;
  return tokens.every(isChordToken);
}

function chordPositions(line) {
  const positions = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(line)) !== null) {
    positions.push({ col: m.index, chord: m[0] });
  }
  return positions;
}

function mergeChordLyric(chordLine, lyricLine) {
  const positions = chordPositions(chordLine);
  if (!positions.length) return lyricLine;
  let result = '';
  let lyric = lyricLine || '';
  let lastCol = 0;
  for (const { col, chord } of positions) {
    while (lyric.length < col) lyric += ' ';
    result += lyric.slice(lastCol, col);
    result += '[' + chord + ']';
    lastCol = col;
  }
  result += lyric.slice(lastCol);
  return result;
}

function preprocessChordChart(src) {
  const lines = src.split('\n');
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const raw = lines[i];
    // Existing ChordPro lines (contain inline [...]) pass through
    if (/\[[^\]]+\]/.test(raw)) { out.push(raw); i++; continue; }
    // Blank line
    if (!raw.trim()) { out.push(''); i++; continue; }
    // Section header
    const sec = detectSection(raw);
    if (sec) {
      const tagMap = { verse: 'verse', chorus: 'chorus', bridge: 'bridge' };
      if (tagMap[sec.section]) out.push('{start_of_' + tagMap[sec.section] + ': ' + sec.label + '}');
      else out.push('{comment: ' + sec.label + '}');
      i++;
      continue;
    }
    // Chord-only line
    if (isChordLine(raw)) {
      // Look for next non-blank line
      let j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      if (j < lines.length && !isChordLine(lines[j]) && !detectSection(lines[j])) {
        // Pair this chord line with that lyric line
        out.push(mergeChordLyric(raw, lines[j]));
        i = j + 1;
        continue;
      } else {
        // Standalone chord-only line — render as inline ChordPro with empty text
        const tokens = raw.trim().split(/\s+/);
        out.push(tokens.map(c => '[' + c + ']').join(' '));
        i++;
        continue;
      }
    }
    // Plain lyric line
    out.push(raw);
    i++;
  }
  return out.join('\n');

      if (firstBracket > 0) parts.push({ chord: '', text: line.slice(0, firstBracket) });
      let i = Math.max(0, firstBracket);
      while (i < line.length) {
        if (line[i] === '[') {
          const close = line.indexOf(']', i);
          if (close === -1) break;
          const chord = line.slice(i + 1, close);
          i = close + 1;
          let next = line.indexOf('[', i);
          if (next === -1) next = line.length;
          parts.push({ chord, text: line.slice(i, next) });
          i = next;
        } else { i++; }
      }
      out.push({ type: 'lyric', parts });
    } else {
      out.push({ type: 'lyric', parts: [{ chord: '', text: line }] });
    }
  }
  return out;
}

// ----- Transpose (unchanged) --------------------------------
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb','Cb','Dm','Gm','Cm','Fm','Bbm','Ebm','Abm']);

function noteIndex(n) {
  const s = SHARPS.indexOf(n); if (s !== -1) return s;
  return FLATS.indexOf(n);
}
function transposeNote(n, semis, useFlats) {
  const idx = noteIndex(n);
  if (idx === -1) return n;
  const i = (((idx + semis) % 12) + 12) % 12;
  return (useFlats ? FLATS : SHARPS)[i];
}
function transposeKey(key, semis) {
  const m = key.match(/^([A-G][b#]?)(m?.*)$/);
  if (!m) return key;
  const root = m[1], rest = m[2] || '';
  const flatGuess  = transposeNote(root, semis, true)  + rest;
  const sharpGuess = transposeNote(root, semis, false) + rest;
  if (FLAT_KEYS.has(flatGuess)) return flatGuess;
  if (FLAT_KEYS.has(sharpGuess)) return sharpGuess;
  return sharpGuess;
}
function transposeChord(chord, semis, useFlats) {
  const m = chord.match(/^([A-G][b#]?)([^\/]*)(?:\/([A-G][b#]?))?$/);
  if (!m) return chord;
  const root = transposeNote(m[1], semis, useFlats);
  const suffix = m[2] || '';
  const bass = m[3] ? '/' + transposeNote(m[3], semis, useFlats) : '';
  return root + suffix + bass;
}
function isFlatContext(key, offset) { return FLAT_KEYS.has(transposeKey(key, offset)); }

// ----- State ------------------------------------------------
const state = {
  setIndex: 0,
  songIndex: 0,
  parsed: [],
  transposeOffset: 0,
  scrollSpeed: 36,
  playing: false,
  lastTs: 0,
  metroStart: 0,
  beatsPerBar: 4,
  currentBeat: -1,
  virtualScroll: 0,  // float accumulator so fractional px/frame motion isn't lost
  pendingSetTransition: null,
};

function currentSet() { return GIG.sets[state.setIndex]; }
function currentSong() { return currentSet().songs[state.songIndex]; }

// ----- DOM refs ---------------------------------------------
const el = {
  gigName: document.getElementById('gigName'),
  setTabs: document.getElementById('setTabs'),
  songPickerBtn: document.getElementById('songPickerBtn'),
  songPickerMenu: document.getElementById('songPickerMenu'),
  title: document.getElementById('songTitle'),
  artist: document.getElementById('songArtist'),
  pos: document.getElementById('songPos'),
  draftBadge: document.getElementById('draftBadge'),
  key: document.getElementById('songKey'),
  bpm: document.getElementById('songBpm'),
  time: document.getElementById('songTime'),
  beats: document.getElementById('beats'),
  transOffset: document.getElementById('transOffset'),
  transUp: document.getElementById('transUp'),
  transDown: document.getElementById('transDown'),
  prevSong: document.getElementById('prevSong'),
  nextSong: document.getElementById('nextSong'),
  chart: document.getElementById('chart'),
  playBtn: document.getElementById('playBtn'),
  restartBtn: document.getElementById('restartBtn'),
  speed: document.getElementById('speedSlider'),
  speedLabel: document.getElementById('speedLabel'),
  progressFill: document.getElementById('progressFill'),
  elapsedTime: document.getElementById('elapsedTime'),
  remainingTime: document.getElementById('remainingTime'),
  modal: document.getElementById('setCompleteModal'),
  modalSubtitle: document.getElementById('modalSubtitle'),
  modalMeta: document.getElementById('modalMeta'),
  modalCancel: document.getElementById('modalCancel'),
  modalStart: document.getElementById('modalStart'),
};

// ----- Helpers ----------------------------------------------
function formatTime(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + sec.toString().padStart(2, '0');
}

// ----- Render -----------------------------------------------
function renderGigBar() {
  el.gigName.textContent = GIG.name;
  el.setTabs.innerHTML = '';
  GIG.sets.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'set-tab' + (i === state.setIndex ? ' active' : '');
    b.textContent = s.name;
    b.addEventListener('click', () => loadSong(i, 0));
    el.setTabs.appendChild(b);
  });
}

function renderSongPicker() {
  el.songPickerMenu.innerHTML = '';
  const songs = currentSet().songs;
  songs.forEach((song, idx) => {
    const item = document.createElement('div');
    item.className = 'picker-item' + (idx === state.songIndex ? ' current' : '');
    const num = document.createElement('span');
    num.className = 'picker-num';
    num.textContent = (idx + 1) + '.';
    const title = document.createElement('span');
    title.className = 'picker-title';
    title.textContent = song.title;
    item.appendChild(num);
    item.appendChild(title);
    if (song.draft) {
      const b = document.createElement('span');
      b.className = 'picker-badge';
      b.textContent = 'DRAFT';
      item.appendChild(b);
    }
    item.addEventListener('click', () => {
      loadSong(state.setIndex, idx);
      closeSongPicker();
    });
    el.songPickerMenu.appendChild(item);
  });
  el.songPickerBtn.textContent = currentSet().name + ' · ' + (state.songIndex + 1) + ' of ' + songs.length + ' ▾';
}

function renderTOC() {
  const tocContent = document.getElementById('toc-content');
  const tocGigName = document.getElementById('tocGigName');
  tocGigName.textContent = GIG.name;
  tocContent.innerHTML = '';

  GIG.sets.forEach((set, setIdx) => {
    const setDiv = document.createElement('div');
    setDiv.className = 'toc-set' + (setIdx === state.setIndex ? ' current' : '');
    setDiv.dataset.setIdx = setIdx;

    const setTitle = document.createElement('div');
    setTitle.className = 'toc-set-title';
    setTitle.textContent = set.name;
    setDiv.appendChild(setTitle);

    const songsDiv = document.createElement('div');
    songsDiv.className = 'toc-songs';

    set.songs.forEach((song, songIdx) => {
      const songDiv = document.createElement('div');
      songDiv.className = 'toc-song' + (setIdx === state.setIndex && songIdx === state.songIndex ? ' current' : '');
      songDiv.dataset.setIdx = setIdx;
      songDiv.dataset.songIdx = songIdx;
      songDiv.textContent = song.title;
      songDiv.addEventListener('click', () => {
        loadSong(setIdx, songIdx);
        // Close sidebar on mobile after clicking a song
        const sidebar = document.getElementById('toc-sidebar');
        sidebar.classList.remove('open');
      });
      songsDiv.appendChild(songDiv);
    });

    setDiv.appendChild(songsDiv);
    tocContent.appendChild(setDiv);
  });
}

// Build a button for every section in the current song's chord chart.
// Each button jumps directly to that specific section (by line index).
function renderSectionButtons() {
  const container = document.getElementById('sectionBtns');
  container.innerHTML = '';
  state.parsed.forEach((node, lineIdx) => {
    if (node.type !== 'section') return;
    const btn = document.createElement('button');
    btn.className = 'section-btn';
    btn.textContent = node.label;
    btn.dataset.lineIndex = lineIdx;
    btn.addEventListener('click', () => {
      const sectionEl = el.chart.querySelector('.line.section[data-line-index="' + lineIdx + '"]');
      if (sectionEl) {
        const target = sectionEl.offsetTop - el.chart.clientHeight * 0.12;
        el.chart.scrollTop = target;
        state.virtualScroll = target;
      }
    });
    container.appendChild(btn);
  });
}

function loadSong(setIdx, songIdx) {
  state.setIndex = Math.max(0, Math.min(GIG.sets.length - 1, setIdx));
  const songs = currentSet().songs;
  state.songIndex = Math.max(0, Math.min(songs.length - 1, songIdx));
  const song = currentSong();
  const src = song.chordPro ? preprocessChordChart(song.chordPro) : '';
  state.parsed = parseChordPro(src);
  state.transposeOffset = 0;
  state.currentBeat = -1;
  const [num] = (song.time || '4/4').split('/').map(Number);
  state.beatsPerBar = num || 4;
  togglePlay(false);
  renderGigBar();
  renderSongPicker();
  renderTopbar();
  renderBeats();
  renderChart();
  renderSectionButtons();
  renderTOC();
  el.chart.scrollTop = 0;
  state.virtualScroll = 0;

  // If song has durationSec, auto-calibrate scroll speed so the chart
  // scrolls end-to-end in exactly that time. Progress bar then shows
  // real elapsed/remaining time for the song.
  if (song.durationSec && song.chordPro) {
    // Defer one frame so layout has settled and scrollHeight is final
    requestAnimationFrame(() => {
      const scrollable = el.chart.scrollHeight - el.chart.clientHeight;
      if (scrollable > 0) {
        const derived = scrollable / song.durationSec;
        state.scrollSpeed = derived;
        el.speed.value = Math.round(derived);
        el.speedLabel.textContent = Math.round(derived) + ' px/s';
      }
    });
  }
}

function renderTopbar() {
  const s = currentSong();
  el.title.textContent = s.title;
  el.artist.textContent = s.artist ? ' — ' + s.artist : '';
  el.pos.textContent = '(' + (state.songIndex + 1) + ' of ' + currentSet().songs.length + ' · ' + currentSet().name + ')';
  el.draftBadge.hidden = !s.draft;
  el.bpm.textContent = s.bpm;
  el.time.textContent = s.time;
  updateKey();
}

function updateKey() {
  const s = currentSong();
  el.key.textContent = transposeKey(s.key, state.transposeOffset);
  el.transOffset.textContent = (state.transposeOffset > 0 ? '+' : '') + state.transposeOffset;
}

function renderBeats() {
  el.beats.innerHTML = '';
  for (let i = 0; i < state.beatsPerBar; i++) {
    const d = document.createElement('div');
    d.className = 'beat' + (i === 0 ? ' downbeat' : '');
    el.beats.appendChild(d);
  }
}

function renderChart() {
  const s = currentSong();
  el.chart.innerHTML = '';

  if (s.draft) {
    const card = document.createElement('div');
    card.className = 'draft-card';
    card.innerHTML = '<div class="label">DRAFT</div>' +
                     '<h2>' + escapeHtml(s.title) + '</h2>' +
                     '<p>This song is in draft. The chord chart has not been entered yet.</p>' +
                     (s.draftNote ? '<div class="ref">' + escapeHtml(s.draftNote) + '</div>' : '');
    el.chart.appendChild(card);
    return;
  }

  const useFlats = isFlatContext(s.key, state.transposeOffset);
  state.parsed.forEach((node, i) => {
    if (node.type === 'blank') {
      const div = document.createElement('div');
      div.className = 'line blank';
      div.dataset.lineIndex = i;
      el.chart.appendChild(div);
      return;
    }
    if (node.type === 'section') {
      const div = document.createElement('div');
      div.className = 'line section';
      div.dataset.lineIndex = i;
      div.dataset.section = node.section;
      div.textContent = node.label;
      el.chart.appendChild(div);
      return;
    }
    if (node.type === 'comment') {
      const div = document.createElement('div');
      div.className = 'line comment';
      div.dataset.lineIndex = i;
      div.textContent = node.label;
      el.chart.appendChild(div);
      return;
    }
    if (node.type === 'lyric') {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      lineDiv.dataset.lineIndex = i;
      let chordLine = '', lyricLine = '';
      for (const p of node.parts) {
        const t = p.chord ? transposeChord(p.chord, state.transposeOffset, useFlats) : '';
        while (chordLine.length < lyricLine.length) chordLine += ' ';
        chordLine += t;
        lyricLine += p.text;
        while (lyricLine.length < chordLine.length) lyricLine += ' ';
      }
      const hasChord = node.parts.some(p => p.chord);
      if (hasChord) {
        const chordRow = document.createElement('div');
        chordRow.className = 'chord-row';
        chordRow.textContent = chordLine || ' ';
        lineDiv.appendChild(chordRow);
      }
      const lyricRow = document.createElement('div');
      lyricRow.className = 'lyric-row';
      lyricRow.textContent = lyricLine || ' ';
      lineDiv.appendChild(lyricRow);
      el.chart.appendChild(lineDiv);
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ----- Highlight & scroll -----------------------------------
function updateHighlight() {
  const playheadY = el.chart.clientHeight * 0.12;
  const lines = el.chart.querySelectorAll('.line');
  const chartTop = el.chart.getBoundingClientRect().top;
  let active = -1;
  let activeSectionLineIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    const r = lines[i].getBoundingClientRect();
    const rel = { top: r.top - chartTop, bottom: r.bottom - chartTop };
    if (rel.top <= playheadY && rel.bottom >= playheadY) { active = i; }
    // Track the most-recent section above (or at) the playhead
    if (lines[i].classList.contains('section') && rel.top <= playheadY) {
      activeSectionLineIdx = parseInt(lines[i].dataset.lineIndex, 10);
    }
  }
  lines.forEach((l, i) => l.classList.toggle('active', i === active));
  // Highlight the corresponding section button
  document.querySelectorAll('.section-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.lineIndex, 10) === activeSectionLineIdx);
  });
}

function updateProgress() {
  const max = el.chart.scrollHeight - el.chart.clientHeight;
  if (max <= 0) {
    el.progressFill.style.width = '0%';
    el.elapsedTime.textContent = '0:00';
    el.remainingTime.textContent = '-0:00';
    return;
  }
  const pct = Math.max(0, Math.min(1, el.chart.scrollTop / max));
  el.progressFill.style.width = (pct * 100).toFixed(2) + '%';
  // Prefer the song's true duration if set, otherwise derive from scroll speed
  const song = currentSong();
  const totalSec = (song && song.durationSec) ? song.durationSec : (max / state.scrollSpeed);
  const elapsedSec = pct * totalSec;
  el.elapsedTime.textContent = formatTime(elapsedSec);
  el.remainingTime.textContent = '-' + formatTime(totalSec - elapsedSec);
}

function tick(ts) {
  if (!state.lastTs) state.lastTs = ts;
  const dt = (ts - state.lastTs) / 1000;
  state.lastTs = ts;
  if (state.playing) {
    state.virtualScroll += state.scrollSpeed * dt;
    el.chart.scrollTop = state.virtualScroll;
    if (state.virtualScroll >= el.chart.scrollHeight - el.chart.clientHeight - 1) togglePlay(false);
  } else {
    // While paused / manually scrolling, keep virtualScroll synced to real position
    state.virtualScroll = el.chart.scrollTop;
  }
  updateHighlight();
  updateMetronome(ts);
  updateProgress();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function updateMetronome(ts) {
  if (!state.playing) {
    if (state.currentBeat !== -1) {
      el.beats.querySelectorAll('.beat').forEach(b => b.classList.remove('active'));
      state.currentBeat = -1;
    }
    return;
  }
  const msPerBeat = 60000 / currentSong().bpm;
  const elapsed = ts - state.metroStart;
  const beatIdx = Math.floor(elapsed / msPerBeat) % state.beatsPerBar;
  if (beatIdx !== state.currentBeat) {
    state.currentBeat = beatIdx;
    el.beats.querySelectorAll('.beat').forEach((b, i) => b.classList.toggle('active', i === beatIdx));
  }
}

// ----- Controls ---------------------------------------------
function togglePlay(force) {
  const next = typeof force === 'boolean' ? force : !state.playing;
  state.playing = next;
  el.playBtn.textContent = next ? '⏸ Pause' : '▶ Play';
  el.playBtn.classList.toggle('active', next);
  if (next) { state.metroStart = performance.now(); state.currentBeat = -1; }
}
el.playBtn.addEventListener('click', () => togglePlay());
el.restartBtn.addEventListener('click', () => { el.chart.scrollTop = 0; state.virtualScroll = 0; togglePlay(false); });
// Note: dynamic section buttons are wired up per-button inside renderSectionButtons()

el.transUp.addEventListener('click', () => {
  state.transposeOffset = Math.min(state.transposeOffset + 1, 11);
  updateKey(); renderChart();
});
el.transDown.addEventListener('click', () => {
  state.transposeOffset = Math.max(state.transposeOffset - 1, -11);
  updateKey(); renderChart();
});

el.speed.addEventListener('input', () => {
  state.scrollSpeed = +el.speed.value;
  el.speedLabel.textContent = state.scrollSpeed + ' px/s';
});

// Prev / Next — navigate within the current set, with end-of-set handoff
el.prevSong.addEventListener('click', () => {
  if (state.songIndex > 0) {
    loadSong(state.setIndex, state.songIndex - 1);
  } else if (state.setIndex > 0) {
    // Go to last song of previous set
    const prevSet = state.setIndex - 1;
    loadSong(prevSet, GIG.sets[prevSet].songs.length - 1);
  }
});
el.nextSong.addEventListener('click', () => {
  const songs = currentSet().songs;
  if (state.songIndex < songs.length - 1) {
    loadSong(state.setIndex, state.songIndex + 1);
  } else if (state.setIndex < GIG.sets.length - 1) {
    // End-of-set handoff
    openSetCompleteModal();
  } else {
    // End of gig
    openSetCompleteModal(true);
  }
});

// Set complete modal
function openSetCompleteModal(gigComplete) {
  if (gigComplete) {
    el.modalSubtitle.textContent = 'Gig Complete';
    el.modalMeta.textContent = 'You have finished the last song of the gig.';
    el.modalStart.hidden = true;
  } else {
    const nextSet = GIG.sets[state.setIndex + 1];
    el.modalSubtitle.textContent = currentSet().name + ' Complete';
    el.modalMeta.textContent = 'Next up: ' + nextSet.name + ' (' + nextSet.songs.length + ' songs)';
    el.modalStart.hidden = false;
    el.modalStart.textContent = 'Start ' + nextSet.name;
  }
  el.modal.classList.add('open');
}
el.modalCancel.addEventListener('click', () => el.modal.classList.remove('open'));
el.modalStart.addEventListener('click', () => {
  el.modal.classList.remove('open');
  loadSong(state.setIndex + 1, 0);
});

// Song picker dropdown
function openSongPicker()  { el.songPickerMenu.classList.add('open'); }
function closeSongPicker() { el.songPickerMenu.classList.remove('open'); }
el.songPickerBtn.addEventListener('click', e => {
  e.stopPropagation();
  el.songPickerMenu.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!el.songPickerMenu.contains(e.target) && e.target !== el.songPickerBtn) closeSongPicker();
});

// Sidebar toggle (mobile)
const tocToggle = document.getElementById('toc-toggle');
const tocSidebar = document.getElementById('toc-sidebar');
if (tocToggle) {
  tocToggle.addEventListener('click', e => {
    e.stopPropagation();
    tocSidebar.classList.toggle('open');
  });
}
// Close sidebar when clicking outside on mobile
document.addEventListener('click', e => {
  if (tocSidebar && !tocSidebar.contains(e.target) && e.target !== tocToggle) {
    tocSidebar.classList.remove('open');
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === '+' || e.key === '=') el.transUp.click();
  else if (e.key === '-' || e.key === '_') el.transDown.click();
  else if (e.key === 'n' || e.key === 'N') el.nextSong.click();
  else if (e.key === 'p' || e.key === 'P') el.prevSong.click();
});

// Init
loadSong(0, 0);
</script>
</body>
